<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>comTexto — Powered by Dialetus</title>

  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="./css/app.css" />
</head>
<body class="bg-light">

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-lg-10 col-xl-8">

        <!-- HEADER -->
        <section class="text-center mb-4">
          <h1 class="display-5 fw-bold mb-2">comTexto</h1>
          <p class="text-muted mb-0">Powered by Dialetus</p>
        </section>

        <!-- CARD PRINCIPAL -->
        <section class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">

            <!-- ENTRADA -->
            <div class="mb-3">
              <label for="inputText" class="form-label fw-semibold">Manda a real:</label>
              <textarea
                id="inputText"
                class="form-control"
                rows="5"
                maxlength="500"
                placeholder="Ex.: preciso falar isso sem parecer grosso"
              ></textarea>
              <div class="d-flex justify-content-between mt-2">
                <small class="text-muted">Mínimo: 8 caracteres</small>
                <small id="charCounter" class="text-muted">0/500</small>
              </div>
            </div>

            <!-- MODOS -->
            <div class="mb-4">
              <label class="form-label fw-semibold d-block">Escolha o tradutor:</label>

              <div class="d-flex flex-wrap gap-2" id="modeButtons">
                <button type="button" class="btn btn-outline-dark mode-btn active" data-mode="corporate">
                  Corporativês
                </button>
                <button type="button" class="btn btn-outline-dark mode-btn" data-mode="boteco">
                  Butequês
                </button>
                <button type="button" class="btn btn-outline-dark mode-btn" data-mode="linkedin">
                  LinkedInês
                </button>
              </div>
            </div>

            <!-- AÇÃO -->
            <div class="d-grid mb-4">
              <button id="translateBtn" class="btn btn-dark btn-lg">
                Traduzir
              </button>
            </div>

            <!-- RESULTADO -->
            <div class="mb-3">
              <label for="outputText" class="form-label fw-semibold">Saiu assim:</label>
              <textarea
                id="outputText"
                class="form-control bg-white"
                rows="5"
                readonly
                placeholder="Sua tradução aparece aqui..."
              ></textarea>
            </div>

            <!-- BOTÕES RESULTADO -->
            <div class="d-flex flex-wrap gap-2 justify-content-end">
              <button id="clearBtn" type="button" class="btn btn-outline-secondary">
                Limpar
              </button>
              <button id="copyBtn" type="button" class="btn btn-outline-primary">
                Copiar
              </button>
            </div>

          </div>
        </section>

        <!-- EXEMPLOS -->
        <section class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4">
            <h2 class="h5 fw-bold mb-3">Sem ideia? Toma um exemplo.</h2>

            <div class="d-grid gap-2">
              <button type="button" class="btn btn-outline-secondary text-start example-btn">
                esse prazo tá ridículo e vai dar merda
              </button>

              <button type="button" class="btn btn-outline-secondary text-start example-btn">
                preciso falar isso sem parecer um cavalo
              </button>

              <button type="button" class="btn btn-outline-secondary text-start example-btn">
                quero discordar sem parecer que tô comprando briga
              </button>
            </div>
          </div>
        </section>

        <!-- APOIO -->
        <section class="card shadow-sm border-0 mb-4">
          <div class="card-body p-4 text-center">
            <button id="coffeeBtn" class="btn btn-warning fw-semibold px-4">
              Curtiu? Fortalece ☕
            </button>
            <p class="text-muted mt-3 mb-0">
              Traduzimos sua vontade pra você não passar vergonha.
            </p>
          </div>
        </section>

        <!-- ADSENSE PLACEHOLDER -->
        <section class="card shadow-sm border-0">
          <div class="card-body p-4 text-center">
            <small class="text-muted d-block mb-2">Espaço reservado para a agiotagem do Google</small>
            <div class="adsense-placeholder border rounded p-4 bg-white">
              <span class="text-muted">AdSense vem depois.</span>
            </div>
          </div>
        </section>

      </div>
    </div>
  </main>

  <script src="./js/app.js"></script>
</body>
</html>
